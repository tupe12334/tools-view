name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run build

      - run: pnpm run test:coverage

  linecheck:
    runs-on: ubuntu-latest
    env:
      LINECHECK_VERSION: v1.2.2
      LINECHECK_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install linecheck
        run: |
          ARCHIVE="linecheck-$LINECHECK_VERSION-$LINECHECK_TARGET.tar.gz"
          BASE="https://github.com/tupe12334/linecheck/releases/download/$LINECHECK_VERSION/$ARCHIVE"
          curl -fsSLO "$BASE"
          curl -fsSLO "$BASE.sha256"
          sha256sum -c "$ARCHIVE.sha256"
          tar xzf "$ARCHIVE"
          sudo install "linecheck-$LINECHECK_VERSION-$LINECHECK_TARGET/linecheck" /usr/local/bin/

      - name: Run linecheck
        run: linecheck .
